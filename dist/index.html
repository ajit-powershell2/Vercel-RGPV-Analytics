<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12233b" />
    <meta
      name="description"
      content="Check your RGPV semester result and browse university-wide analytics."
    />
    <title>RGPV Result Analytics</title>
    <!-- Apply the saved theme before first paint to avoid a light->dark flash
         on refresh. Light remains the default for first-time visitors. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("rgpv-theme")
          if (t === "dark") {
            document.documentElement.setAttribute("data-theme", "dark")
          }
        } catch (e) {}
      })()
    </script>
